<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Student | Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="card">
  <h2>Add Student</h2>
  <p class="subtitle">Admin Panel</p>

  <form method="post" onsubmit="return confirm('Would you like to save these changes?');">
    <input type="text" name="admission_id" placeholder="Admission ID" required>
    <input type="text" name="student_name" placeholder="Student Name" required>

    {% if is_staff %}
      <input type="text" value="{{ staff_department }}" readonly>
      <input type="hidden" name="branch" value="{{ staff_department }}">
    {% else %}
      <select name="branch">
        <option>Computer Engineering</option>
        <option>Electronics & Communication</option>
        <option>Mechanical</option>
        <option>Automobile</option>
      </select>
    {% endif %}

    <input type="text" name="year_sem" placeholder="Year / Semester">
    <input type="text" name="mobile" placeholder="Mobile Number">
    <div class="password-wrapper">
      <input type="password" id="add_student_password" name="password" class="preserve-case" placeholder="Set Password" required autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">
      <button type="button" class="toggle-password" onclick="togglePassword('add_student_password', this)" aria-label="Show password" title="Show password">
        <span aria-hidden="true">&#128065;</span>
      </button>
    </div>

    <button type="submit">Add Student</button>
  </form>

  <a class="link" href="/admin">⬅ Back to Dashboard</a>
</div>

  <script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>
</body>
</html>
