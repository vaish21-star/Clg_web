<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Forgot Password | SVP</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="card">
    <h2>Admin Forgot Password</h2>
    <p class="subtitle">Reset via Gmail OTP</p>
    {% if error %}<p style="color:#c62828">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="login_id" placeholder="Admin username or registered email" required>
      <button type="submit">Send OTP</button>
    </form>
    <a class="link" href="/login/staff">Back</a>
  </div>
</body>
</html>
